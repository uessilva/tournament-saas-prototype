<!doctype html>
<!-- Three structural variants of the complete guided demo, switchable via ?variant=A|B|C. Throwaway wireframe only. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo experience prototype — Summer Cup</title>
  <style>
    :root { --ink:#17231d; --muted:#65736b; --paper:#f5f4ef; --card:#fff; --green:#176b46; --lime:#d8f36a; --line:#dce2dc; --orange:#e7864a; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; } a { color:inherit; } .muted { color:var(--muted); } .eyebrow { font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .btn { border:0; border-radius:9px; padding:10px 15px; background:var(--ink); color:white; font-weight:700; } .btn.secondary { background:white; color:var(--ink); border:1px solid var(--line); }
    .tag { display:inline-flex; padding:4px 8px; border-radius:99px; background:#e6eee8; color:var(--green); font-size:11px; font-weight:800; } .tag.orange { background:#fff0e5; color:#9b4a1c; }
    .view-link { border:0; background:none; text-align:left; padding:8px 10px; border-radius:7px; } .view-link:hover,.view-link.active { background:#e9eee9; color:var(--green); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; } h1,h2,h3,p { margin-top:0; } h1 { font-size:32px; line-height:1.1; letter-spacing:-.04em; } h2 { font-size:21px; letter-spacing:-.025em; }
    .progress { display:flex; gap:8px; margin:18px 0; } .step { flex:1; border-top:3px solid var(--line); padding-top:8px; font-size:12px; } .step.done { border-color:var(--green); } .step.current { border-color:var(--orange); font-weight:800; }
    .metric { font-size:30px; font-weight:800; letter-spacing:-.04em; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:11px 8px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:11px; text-transform:uppercase; }
    /* A: conventional role sidebar and guided task canvas */
    .a { display:grid; grid-template-columns:230px 1fr; min-height:100vh; } .a-side { background:#fff; border-right:1px solid var(--line); padding:26px 16px; } .brand { font-size:19px; font-weight:900; margin:0 10px 28px; } .brand span { color:var(--green); }
    .a-side nav { display:grid; gap:4px; } .a-side .seed { margin-top:30px; padding:14px; background:var(--paper); border-radius:10px; font-size:12px; } .a-main { padding:32px 42px 100px; max-width:1250px; } .a-head { display:flex; justify-content:space-between; align-items:start; gap:20px; }
    .a-grid { display:grid; grid-template-columns:1.7fr 1fr; gap:18px; } .a-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; } .a-metrics .card { padding:15px; }
    /* B: dense operations workspace, horizontal navigation and queues */
    .b { background:#eef1ee; min-height:100vh; padding-bottom:100px; } .b-top { background:var(--ink); color:white; padding:14px 28px; display:flex; align-items:center; gap:28px; } .b-top .brand { margin:0 auto 0 0; } .b-top .view-link { color:#dbe4de; } .b-top .view-link.active { background:#ffffff1c; color:var(--lime); }
    .b-title { padding:24px 28px 12px; display:flex; justify-content:space-between; } .b-work { display:grid; grid-template-columns:260px 1fr 290px; gap:1px; margin:0 28px; border:1px solid #cfd7d0; background:#cfd7d0; border-radius:10px; overflow:hidden; } .b-col { background:white; padding:18px; min-height:510px; } .b-queue { display:grid; gap:8px; } .b-item { padding:12px; border:1px solid var(--line); border-radius:8px; } .b-item.selected { border-left:4px solid var(--orange); background:#fff8f2; } .b-detail { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .score { font:800 35px/1 ui-monospace,monospace; background:#f2f4f2; padding:20px; text-align:center; border-radius:8px; }
    /* C: public-first editorial event hub */
    .c { min-height:100vh; background:#fbfaf6; padding-bottom:100px; } .c-nav { display:flex; align-items:center; padding:20px 5vw; gap:10px; } .c-nav .brand { margin:0 auto 0 0; } .c-hero { margin:0 5vw; padding:42px; min-height:250px; border-radius:24px; background:var(--green); color:white; display:grid; grid-template-columns:1.5fr 1fr; align-items:end; overflow:hidden; position:relative; } .c-hero:after { content:""; position:absolute; width:280px; height:280px; border:55px solid var(--lime); border-radius:50%; right:-90px; top:-130px; opacity:.85; } .c-hero h1 { font-size:52px; max-width:650px; margin-bottom:12px; } .c-score { background:var(--lime); color:var(--ink); padding:22px; border-radius:16px; z-index:1; } .c-journey { display:flex; gap:6px; margin:24px 5vw; overflow:auto; } .c-journey .view-link { white-space:nowrap; background:#eef0e9; } .c-content { margin:0 5vw; display:grid; grid-template-columns:1.35fr .65fr; gap:24px; } .c-feature { padding:30px; border-top:4px solid var(--ink); background:white; } .c-aside { padding:25px; background:#ece9dd; border-radius:16px; }
    .switcher { position:fixed; z-index:10; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; background:#101713; color:white; padding:8px 12px; border-radius:99px; box-shadow:0 8px 30px #0004; } .switcher button { border:0; background:#ffffff18; color:white; width:32px; height:32px; border-radius:50%; } .switcher span { min-width:165px; text-align:center; font-size:12px; }
    @media(max-width:850px) { .a { grid-template-columns:1fr; } .a-side { display:none; } .a-main { padding:24px 18px 100px; } .a-grid,.c-content,.c-hero { grid-template-columns:1fr; } .b-work { grid-template-columns:1fr; margin:0 12px; } .b-col { min-height:0; } .b-top { flex-wrap:wrap; } .c-hero h1 { font-size:38px; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <div class="switcher" aria-label="Prototype variant switcher">
    <button id="prev" aria-label="Previous variant">←</button><span id="variant-name"></span><button id="next" aria-label="Next variant">→</button>
  </div>
<script>
const views = {
  owner: { label:'Owner overview', title:'Good morning, Alex', text:'Summer Cup is ready for its next step.', action:'Continue guided demo' },
  setup: { label:'Competition setup', title:'Set up Under-12 Football', text:'Groups + knockout · 8 teams · 2 groups · 2 qualifiers each', action:'Preview tournament' },
  invite: { label:'Team invitations', title:'Bring the teams in', text:'6 of 8 Team Managers have accepted. Two invitations need attention.', action:'Invite Team Manager' },
  manager: { label:'Manager roster', title:'Riverside Rovers', text:'Complete your roster before tournament generation.', action:'Add Participant' },
  fixtures: { label:'Fixtures & scoresheets', title:'Fixtures are ready', text:'Group A · Riverside Rovers vs Harbour Athletic · Pitch 2', action:'Download Scoresheet' },
  review: { label:'Result review', title:'Review extracted result', text:'The original Scoresheet stays beside editable values. Two fields need attention.', action:'Confirm & publish' },
  public: { label:'Public leaderboards', title:'Summer Cup 2026', text:'Published fixtures, standings, results, and statistical leaders—no sign-in required.', action:'View live standings' }
};
const order = Object.keys(views), variants = ['A','B','C'], names = {A:'Guided workspace',B:'Operations desk',C:'Event hub'};
const params = new URLSearchParams(location.search); let variant = variants.includes(params.get('variant')) ? params.get('variant') : 'A'; let view = views[params.get('view')] ? params.get('view') : 'owner';
const go = (key,value) => { const p=new URLSearchParams(location.search); p.set(key,value); location.search=p; };
const link = v => `<button class="view-link ${v===view?'active':''}" onclick="go('view','${v}')">${views[v].label}</button>`;
const progress = `<div class="progress"><div class="step done">1 · Create event</div><div class="step done">2 · Invite teams</div><div class="step current">3 · Generate</div><div class="step">4 · Review result</div><div class="step">5 · Publish</div></div>`;
const table = `<table><thead><tr><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody><tr><td>Riverside Rovers</td><td>2</td><td>+4</td><td>6</td></tr><tr><td>Harbour Athletic</td><td>2</td><td>+1</td><td>4</td></tr><tr><td>Westfield Juniors</td><td>2</td><td>−2</td><td>1</td></tr></tbody></table>`;
const review = `<div><span class="tag orange">2 flagged fields</span><h3>Riverside Rovers vs Harbour Athletic</h3><div class="score">3 &nbsp;—&nbsp; 1</div><p class="muted">Home goals · confidence 62%<br>Away goals · verified from AcroForm</p></div><div class="card"><span class="eyebrow">Original Scoresheet</span><div style="height:150px;margin-top:14px;background:repeating-linear-gradient(#fff,#fff 27px,#dce2dc 28px);border:8px solid #eee;display:grid;place-items:center;font-size:25px;">3 : 1 ✎</div></div>`;
function content(v, compact=false) {
  if(v==='review') return review;
  if(v==='public') return `<span class="tag">Published</span><h3>Under-12 Football · Group A</h3>${table}<p class="muted">Top scorer: Maya Chen · 5 goals</p>`;
  if(v==='fixtures') return `<span class="tag">Match 12</span><h3>Riverside Rovers vs Harbour Athletic</h3><p>Saturday 10:30 · Pitch 2<br>Scoresheet SC-01J8 · Template football-v1</p><p class="muted">Download, complete, then upload for extraction and owner review.</p>`;
  if(v==='manager') return `<span class="tag">11 / 12 Players</span><h3>Roster completeness</h3>${table.replace(/<th>P<\/th><th>GD<\/th><th>Pts<\/th>/,'<th>Age</th><th>Status</th>').replace(/<td>2<\/td><td>\+4<\/td><td>6<\/td>/,'<td>11</td><td>Eligible</td>').replace(/<td>2<\/td><td>\+1<\/td><td>4<\/td>/,'<td>12</td><td>Eligible</td>').replace(/<td>2<\/td><td>−2<\/td><td>1<\/td>/,'<td>—</td><td>Missing</td>')}`;
  if(v==='invite') return `<h3>Invitation status</h3><div class="b-item">maya@example.com <span class="tag">Accepted</span></div><div class="b-item">sam@example.com <span class="tag orange">Expires in 2 days</span></div><div class="b-item">Riverside share link <span class="tag">2 acceptances</span></div>`;
  if(v==='setup') return `<h3>Tournament configuration</h3><p>8 Teams · 2 groups of 4 · Top 2 advance<br>Single round-robin groups · Semi-finals · Final<br>Birth dates: 1 Jan 2014 – 31 Dec 2015</p><span class="tag">All entrants eligible</span>`;
  return `<h3>Event readiness</h3><p>Two Competitions are configured. Football invitations are nearly complete; tennis fixtures have been generated.</p><span class="tag">Seeded & resettable</span>`;
}
function A(){const d=views[view];return `<section class="a"><aside class="a-side"><div class="brand">Fixture<span>flow</span></div><span class="eyebrow muted">Event Owner</span><nav>${order.map(link).join('')}</nav><div class="seed"><b>Demo event</b><br>Summer Cup 2026<br>Football U12 + Tennis Open<br><br>Reset demo ↻</div></aside><div class="a-main"><header class="a-head"><div><span class="eyebrow" style="color:var(--green)">Summer Cup 2026 / ${d.label}</span><h1>${d.title}</h1><p class="muted">${d.text}</p></div><button class="btn">${d.action} →</button></header>${progress}<div class="a-metrics"><div class="card"><span class="muted">Competitions</span><div class="metric">2</div></div><div class="card"><span class="muted">Teams ready</span><div class="metric">6/8</div></div><div class="card"><span class="muted">Needs review</span><div class="metric">1</div></div></div><div class="a-grid"><section class="card">${content(view)}</section><aside class="card"><span class="eyebrow">Guided next step</span><h3>${view==='review'?'Resolve flagged values':'Generate the tournament'}</h3><p class="muted">The demo keeps one clear next action visible while every workspace remains explorable.</p><button class="btn secondary">Open checklist</button></aside></div></div></section>`}
function B(){const d=views[view];return `<section class="b"><header class="b-top"><div class="brand">Fixture<span style="color:var(--lime)">flow</span> / OPS</div>${order.map(link).join('')}</header><div class="b-title"><div><span class="eyebrow">SUMMER CUP 2026 · ${d.label}</span><h1>${d.title}</h1></div><button class="btn">${d.action}</button></div><div class="b-work"><aside class="b-col"><span class="eyebrow">Work queue · 3</span><div class="b-queue" style="margin-top:15px"><div class="b-item selected"><b>Review Match 12</b><br><span class="muted">2 flagged fields</span></div><div class="b-item"><b>2 invitations pending</b><br><span class="muted">Football U12</span></div><div class="b-item"><b>Roster incomplete</b><br><span class="muted">Riverside Rovers</span></div></div></aside><section class="b-col"><span class="eyebrow">Selected workspace</span><h2>${d.label}</h2><p class="muted">${d.text}</p><div class="b-detail">${content(view)}</div></section><aside class="b-col"><span class="eyebrow">Activity & audit</span><h3>Today</h3><p><b>10:42</b><br>Scoresheet uploaded<br><span class="muted">Riverside manager</span></p><p><b>10:43</b><br>OCR completed<br><span class="muted">2 fields flagged</span></p><p><b>09:18</b><br>Invitation accepted<br><span class="muted">maya@example.com</span></p></aside></div></section>`}
function C(){const d=views[view];return `<section class="c"><nav class="c-nav"><div class="brand">Fixture<span>flow</span></div>${order.map(link).join('')}</nav><header class="c-hero"><div><span class="eyebrow">One event. Every moment.</span><h1>${view==='public'?'Follow the Summer Cup.':'Summer Cup 2026'}</h1><p>${d.text}</p><button class="btn" style="background:var(--lime);color:var(--ink)">${d.action} →</button></div><div class="c-score"><span class="eyebrow">Latest published result</span><h2>Riverside 3–1 Harbour</h2><span>Under-12 Football · Group A</span></div></header><div class="c-journey"><span class="eyebrow" style="padding:10px">Explore the journey</span>${order.map(link).join('')}</div><div class="c-content"><article class="c-feature"><span class="eyebrow">${d.label}</span><h2>${d.title}</h2>${content(view)}</article><aside class="c-aside"><span class="eyebrow">The guided story</span><h2>From blank event to public leaders.</h2><p>1. Configure two sports<br>2. Invite managers and build rosters<br>3. Generate repeatable fixtures<br>4. Extract and review a Scoresheet<br>5. Publish standings instantly</p><span class="tag">Human review always visible</span></aside></div></section>`}
function render(){document.getElementById('app').innerHTML=({A,B,C})[variant]();document.getElementById('variant-name').textContent=`${variant} · ${names[variant]}`;document.title=`${variant} — Demo experience prototype`}
function cycle(delta){const next=(variants.indexOf(variant)+delta+variants.length)%3;go('variant',variants[next])}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script>
</body>
</html>
